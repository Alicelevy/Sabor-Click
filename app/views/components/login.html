<main class="tela-autenticacao" id="tela-login" hidden>

    <section class="autenticacao-card">

        <a href="#" class="voltar-home" id="btn-login-home">
            ← Voltar ao início
        </a>

        <div class="autenticacao-cabecalho">
            <span class="marca-icone">S&C</span>
            <h1>Bem-vindo de volta!</h1>
            <p>Acesse sua conta para continuar.</p>
        </div>

        <form id="form-login">

            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    autocomplete="username"
                    placeholder="seuemail@exemplo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="login-senha">Senha</label>
                <input
                    type="password"
                    id="login-senha"
                    name="senha"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required>
            </div>

            <button type="submit" class="btn btn-primary btn-bloco">
                Entrar
            </button>

        </form>

        <div class="autenticacao-rodape">
            <p>Ainda não tem uma conta?</p>

            <button type="button"
                    class="link-botao"
                    id="btn-ir-cadastro">
                Criar minha conta
            </button>
        </div>

    </section>

</main>
